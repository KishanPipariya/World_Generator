[project]
name = "world-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "neo4j>=6.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.20.0",
    "pytest>=8.0.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # FastAPI intentionally uses Depends(...) in endpoint defaults.
    "B904",  # Existing handlers raise HTTPException without preserving ValueError context.
    "E501",  # Keep long-line reporting out until the older modules are reformatted.
]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
