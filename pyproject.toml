[project]
name = "world-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "neo4j>=6.1.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.20.0",
    "pytest>=8.0.0",
    "ruff>=0.15.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
